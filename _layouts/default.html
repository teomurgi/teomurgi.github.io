<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="feed" type="application/rss+xml" title="RSS" href="{{ '/feed.xml' | relative_url }}">
  <meta name="description" content="{{ page.description | default: site.description }}">
</head>
<body>
  <header class="site-header">
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p class="tagline">{{ site.description }}</p>
    <nav>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/teomurgi">GitHub</a>
      <a href="https://linkedin.com/in/teomurgi">LinkedIn</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} Matteo Murgida. Built with Jekyll.</p>
  </footer>
</body>
</html>
